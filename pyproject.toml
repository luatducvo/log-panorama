[project]
name = "log-panorama"
version = "0.1.0"
description = "Mobile-friendly Streamlit sheet for 360 panorama location logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.56.2",
    "gspread>=6.2.1",
    "pandas>=3.0.5",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
